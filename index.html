<style>
/* ── the-monospace-web · reset.css ─────────────────────────────────────────
   By Oskar Wickström — MIT
   https://github.com/owickstrom/the-monospace-web                          */
html, body, div, span, applet, object, iframe,
h1, h2, h3, h4, h5, h6, p, blockquote, pre,
a, abbr, acronym, address, big, cite, code,
del, dfn, em, img, ins, kbd, q, s, samp,
small, strike, strong, sub, sup, tt, var,
b, u, i, center,
dl, dt, dd, ol, ul, li,
fieldset, form, label, legend,
table, caption, tbody, tfoot, thead, tr, th, td,
article, aside, canvas, details, embed,
figure, figcaption, footer, header, hgroup,
menu, nav, output, ruby, section, summary,
time, mark, audio, video {
  margin: 0; padding: 0; border: 0;
  font-size: 100%; font: inherit; vertical-align: baseline;
}
article, aside, details, figcaption, figure,
footer, header, hgroup, menu, nav, section { display: block; }
body { line-height: 1; }
ol, ul { list-style: none; }
blockquote, q { quotes: none; }
blockquote:before, blockquote:after,
q:before, q:after { content: ''; content: none; }
table { border-collapse: collapse; border-spacing: 0; }

/* ── the-monospace-web · index.css ──────────────────────────────────────── */
@import url('https://fonts.cdnfonts.com/css/jetbrains-mono-2');

:root {
  --font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --line-height: 1.20rem;
  --border-thickness: 2px;
  --text-color: #000;
  --text-color-alt: #666;
  --background-color: #fff;
  --background-color-alt: #eee;
  --font-weight-normal: 500;
  --font-weight-medium: 600;
  --font-weight-bold: 800;
  font-family: var(--font-family);
  font-optical-sizing: auto;
  font-weight: var(--font-weight-normal);
  font-style: normal;
  font-variant-numeric: tabular-nums lining-nums;
  font-size: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --text-color: #fff; --text-color-alt: #8a8a8a;
    --background-color: #000; --background-color-alt: #131313;
  }
}
:root[data-theme="dark"] {
  --text-color: #fff; --text-color-alt: #8a8a8a;
  --background-color: #000; --background-color-alt: #131313;
}
:root[data-theme="light"] {
  --text-color: #000; --text-color-alt: #666;
  --background-color: #fff; --background-color-alt: #eee;
}

* { box-sizing: border-box; }
* + * { margin-top: var(--line-height); }

html {
  display: flex; width: 100%; margin: 0; padding: 0;
  flex-direction: column; align-items: center;
  background: var(--background-color); color: var(--text-color);
  scroll-behavior: smooth;
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  position: relative; width: 100%; margin: 0;
  padding: var(--line-height) 2ch calc(var(--line-height) * 5);
  max-width: calc(min(80ch, round(down, 100%, 1ch)));
  line-height: var(--line-height);
  overflow-x: hidden;
}
@media screen and (max-width: 480px) {
  :root { font-size: 14px; }
  body { padding: var(--line-height) 1ch calc(var(--line-height) * 5); }
}

h1, h2, h3, h4, h5, h6 {
  font-weight: var(--font-weight-bold);
  margin: calc(var(--line-height) * 2) 0 var(--line-height);
  line-height: var(--line-height);
  scroll-margin-top: var(--line-height);
}
h1 {
  font-size: 2rem; line-height: calc(2 * var(--line-height));
  margin-bottom: calc(var(--line-height) * 2); text-transform: uppercase;
}
h2 { font-size: 1rem; text-transform: uppercase; }

hr {
  position: relative; display: block; height: var(--line-height);
  margin: calc(var(--line-height) * 1.5) 0; border: none; color: var(--text-color);
}
hr:after {
  display: block; content: ""; position: absolute;
  top: calc(var(--line-height) / 2 - var(--border-thickness));
  left: 0; width: 100%;
  border-top: calc(var(--border-thickness) * 3) double var(--text-color);
  height: 0;
}

a:link, a:visited { color: var(--text-color); }

p { margin-bottom: var(--line-height); word-break: break-word; word-wrap: break-word; hyphens: auto; }
strong { font-weight: var(--font-weight-bold); }
em { font-style: italic; }
mark { background: var(--text-color); color: var(--background-color); padding: 0 0.4ch; }

sub, sup {
  position: relative; display: inline-block; margin: 0;
  line-height: 0; width: calc(1ch / 0.75); font-size: .75rem;
}
sub { vertical-align: sub; }
sup { vertical-align: super; }

table {
  position: relative; top: calc(var(--line-height) / 2);
  width: calc(round(down, 100%, 1ch));
  border-collapse: collapse; margin: 0 0 calc(var(--line-height) * 2);
}
th, td {
  border: var(--border-thickness) solid var(--text-color);
  padding:
    calc((var(--line-height) / 2))
    calc(1ch - var(--border-thickness) / 2)
    calc((var(--line-height) / 2) - (var(--border-thickness)));
  line-height: var(--line-height); vertical-align: top; text-align: left;
}
table tbody tr:first-child > * { padding-top: calc((var(--line-height) / 2) - var(--border-thickness)); }
th { font-weight: var(--font-weight-bold); }
.width-min { width: 0%; white-space: nowrap; }
.width-auto { width: 100%; }

img, video { display: block; width: 100%; object-fit: contain; overflow: hidden; }
img { font-style: italic; color: var(--text-color-alt); }

details {
  border: var(--border-thickness) solid var(--text-color);
  padding: calc(var(--line-height) - var(--border-thickness)) 1ch;
  margin-bottom: var(--line-height);
}
summary { font-weight: var(--font-weight-medium); cursor: pointer; text-transform: uppercase; }
details[open] summary { margin-bottom: var(--line-height); }
details > summary::marker { display: inline-block; content: '▶ '; margin: 0; }
details[open] > summary::marker { content: '▼ '; }
details :last-child { margin-bottom: 0; }

pre { white-space: pre; overflow-x: auto; margin: var(--line-height) 0; overflow-y: hidden; }
figure pre { margin: 0; }
pre, code { font-family: var(--font-family); }
code { font-weight: var(--font-weight-medium); }

figure { margin: calc(var(--line-height) * 2) 3ch; overflow-x: auto; overflow-y: hidden; }
figcaption { display: block; font-style: italic; margin-top: var(--line-height); color: var(--text-color-alt); }

ul, ol { padding: 0; margin: 0 0 var(--line-height); }
ul { list-style-type: square; padding: 0 0 0 2ch; }
ol { list-style-type: none; counter-reset: item; padding: 0 0 0 3ch; }
ol ul, ol ol, ul ol, ul ul { padding: 0 0 0 3ch; margin: 0; }
ol li:before {
  content: counters(item, ".") ". ";
  counter-increment: item; font-weight: var(--font-weight-medium);
}
/* hang the counter in the gutter so wrapped lines stay aligned */
ol:not(ol ol) > li { position: relative; }
ol:not(ol ol) > li:before { position: absolute; left: -3ch; width: 3ch; }
li { margin: 0; padding: 0; }
li::marker { line-height: 0; }
::-webkit-scrollbar { height: var(--line-height); width: var(--line-height); }
::-webkit-scrollbar-thumb { background: var(--text-color-alt); }

button {
  border: var(--border-thickness) solid var(--text-color);
  padding: calc(var(--line-height) / 2 - var(--border-thickness)) calc(1ch - var(--border-thickness));
  margin: 0; font: inherit; font-weight: var(--font-weight-medium);
  height: calc(var(--line-height) * 2);
  background: var(--background-color); color: var(--text-color);
  line-height: normal; text-transform: uppercase; cursor: pointer;
  -webkit-appearance: none;
}
button:hover { background: var(--background-color-alt); }
button:active { transform: translate(2px, 2px); }
button:focus-visible { --border-thickness: 3px; outline: none; }

/* tree connectors — upstream .tree */
.tree, .tree ul {
  position: relative; padding-left: 0;
  list-style-type: none; line-height: var(--line-height);
}
.tree ul { margin: 0; }
.tree ul li {
  position: relative; padding-left: 1.5ch; margin-left: 1.5ch;
  border-left: var(--border-thickness) solid var(--text-color);
}
.tree ul li:before {
  position: absolute; display: block;
  top: calc(var(--line-height) / 2); left: 0; content: "";
  width: 1ch; border-bottom: var(--border-thickness) solid var(--text-color);
}
.tree ul li:last-child { border-left: none; }
.tree ul li:last-child:after {
  position: absolute; display: block; top: 0; left: 0; content: "";
  height: calc(var(--line-height) / 2);
  border-left: var(--border-thickness) solid var(--text-color);
}

.grid {
  --grid-cells: 0;
  display: flex; gap: 1ch;
  width: calc(round(down, 100%, (1ch * var(--grid-cells)) - (1ch * var(--grid-cells) - 1)));
  margin-bottom: var(--line-height);
}
.grid > * { flex: 0 0 calc(round(down, (100% - (1ch * (var(--grid-cells) - 1))) / var(--grid-cells), 1ch)); }
.grid:has(> :last-child:nth-child(1)) { --grid-cells: 1; }
.grid:has(> :last-child:nth-child(2)) { --grid-cells: 2; }
.grid:has(> :last-child:nth-child(3)) { --grid-cells: 3; }
.grid:has(> :last-child:nth-child(4)) { --grid-cells: 4; }

/* the character grid, toggled from the status bar */
.debug .debug-grid {
  --color: color-mix(in srgb, var(--text-color) 12%, var(--background-color) 88%);
  position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: -1;
  background-image:
    repeating-linear-gradient(var(--color) 0 1px, transparent 1px 100%),
    repeating-linear-gradient(90deg, var(--color) 0 1px, transparent 1px 100%);
  background-size: 1ch var(--line-height);
  margin: 0;
}
.debug-grid { display: none; }
.debug .debug-grid { display: block; }

/* ══ reader ═══════════════════════════════════════════════════════════════
   Everything below is this site's own layer on top of the-monospace-web.   */

/* ── links ───────────────────────────────────────────────────────────────
   The corpus is dense with cross-references. A full underline on every one
   turns a page into a hatch pattern, so links carry a faint rule that only
   resolves to full contrast under the cursor.                             */
a { text-decoration: none; }
#content a {
  border-bottom: 1px dotted color-mix(in srgb, currentColor 55%, transparent);
}
#content a:hover, #content a:focus-visible {
  background: var(--background-color-alt);
  border-bottom: 1px solid currentColor;
  outline: none;
}
/* navigational links — list entries, table cells, headings — carry no rule
   at all; their position already says they are links. */
#content li > a:first-child,
#content td > a:only-child,
#content th a,
#content h1 a, #content h2 a, #content h3 a, #content h4 a,
#content .toc a, #content .pagenav a, #content .nav-up a {
  border-bottom: none;
  font-weight: var(--font-weight-medium);
}
#content li > a:first-child:hover,
#content td > a:only-child:hover,
#content .toc a:hover,
#content .pagenav a:hover,
#content .nav-up a:hover { background: var(--background-color-alt); }

a[target="_blank"]:after {
  content: "↗"; font-size: .75rem; vertical-align: super;
  line-height: 0; color: var(--text-color-alt); margin-left: .25ch;
}

/* ── masthead ────────────────────────────────────────────────────────────
   Upstream's header table: title and subtitle at left, metadata at right,
   everything landing on the same character grid.                          */
.masthead { margin-bottom: var(--line-height); }
.masthead table { top: 0; margin-bottom: 0; }
.masthead th, .masthead td { border: none; padding: 0; }
.masthead th {
  color: var(--text-color-alt); font-weight: var(--font-weight-normal);
  text-transform: uppercase; padding-right: 1ch; white-space: nowrap;
}
.masthead td { text-align: left; }
.masthead h1 {
  margin: 0; font-size: 1.5rem; line-height: calc(2 * var(--line-height));
  letter-spacing: -0.02em;
}
.masthead .subtitle { display: block; color: var(--text-color-alt); }
.masthead h1 a { border: none; }
.masthead h1 a:hover { background: var(--background-color-alt); }
.masthead .meta { white-space: nowrap; }
/* the keyboard hints are noise on a touch screen */
@media screen and (max-width: 640px), (pointer: coarse) {
  .masthead .keys-row { display: none; }
}
.masthead .meta a { color: var(--text-color-alt); }
.masthead .meta a:hover { color: var(--text-color); }

.crumb { color: var(--text-color-alt); word-break: break-all; }
.crumb a { color: var(--text-color-alt); }
.crumb a:hover { color: var(--text-color); background: var(--background-color-alt); }
.crumb .sep { opacity: .5; }

/* ── document chrome ─────────────────────────────────────────────────── */
#content > *:first-child { margin-top: 0; }
#content h1 { word-break: break-word; }

/* §-numbering, on every page but the index */
#content.numbered h2:before,
#content.numbered h3:before {
  content: attr(data-sec) "  ";
  color: var(--text-color-alt);
  font-weight: var(--font-weight-normal);
}

/* a click target for the section anchor, revealed on hover */
.anchor {
  color: var(--text-color-alt); opacity: 0;
  margin-left: 1ch; font-weight: var(--font-weight-normal);
  border: none !important;
}
h1:hover .anchor, h2:hover .anchor, h3:hover .anchor,
h4:hover .anchor, .anchor:focus-visible { opacity: 1; }

/* the `← Index · Part IV` strip under the title */
.nav-up {
  color: var(--text-color-alt);
  margin-bottom: 0;
}
.nav-up a { color: var(--text-color-alt); }
.nav-up a:hover { color: var(--text-color); }

/* the `*Written 2026-07-30…*` dateline */
.dateline { color: var(--text-color-alt); font-style: italic; }
.dateline em { font-style: italic; }

/* ── table of contents ──────────────────────────────────────────────── */
.toc { margin-bottom: calc(var(--line-height) * 2); }
.toc ul.tree { margin: 0; padding: 0; }
.toc .tree > li { margin-top: 0; }
.toc .tree > li + li { margin-top: 0; }
.toc .sec { color: var(--text-color-alt); }
.toc .tree ul li { margin-top: 0; }

/* ── blockquotes as labelled callouts ───────────────────────────────────
   The corpus uses `> **Prediction:** …` throughout. Hoist that label onto
   the top border so the claim reads as a box you can find by scanning.   */
blockquote {
  position: relative;
  border: var(--border-thickness) solid var(--text-color);
  padding: var(--line-height) 1ch calc(var(--line-height) - var(--border-thickness));
  margin: calc(var(--line-height) * 2) 0 calc(var(--line-height) * 2);
}
blockquote > *:first-child { margin-top: 0; }
blockquote > *:last-child { margin-bottom: 0; }
blockquote[data-label]:before {
  content: attr(data-label);
  position: absolute; top: calc(var(--line-height) * -0.5 - var(--border-thickness) / 2);
  left: 2ch; padding: 0 1ch;
  background: var(--background-color); color: var(--text-color);
  font-weight: var(--font-weight-bold); text-transform: uppercase;
  line-height: var(--line-height); white-space: nowrap;
}
blockquote[data-label] { padding-top: calc(var(--line-height) * 1.25); }

/* ── code ───────────────────────────────────────────────────────────── */
code:not(pre code) { background: var(--background-color-alt); padding: 0 0.4ch; }
pre {
  border: var(--border-thickness) solid var(--text-color);
  padding: calc(var(--line-height) / 2) 1ch;
}
pre code { background: none; padding: 0; }

/* ── tables ─────────────────────────────────────────────────────────── */
/* The scroll box clips, so the table drops upstream's half-line offset here
   and the wrapper carries the spacing instead. */
.table-scroll { overflow-x: auto; margin: var(--line-height) 0 calc(var(--line-height) * 2); }
.table-scroll table { top: 0; margin: 0; min-width: 100%; }
thead th { background: var(--text-color); color: var(--background-color); }
thead th a:link, thead th a:visited { color: var(--background-color); }
tbody tr:hover > * { background: var(--background-color-alt); }

/* ── the index page ─────────────────────────────────────────────────────
   Its `### [00 — Overview](…)` sections are the site map; give each one a
   rule above it so the parts separate at a glance.                       */
#content.index h3 {
  border-top: var(--border-thickness) solid var(--text-color);
  padding-top: calc(var(--line-height) / 2);
  margin-top: calc(var(--line-height) * 2);
  font-size: 1rem; text-transform: uppercase;
}
#content.index h3 + p { color: var(--text-color-alt); }
#content.index ul { padding-left: 2ch; }
#content.index li { margin-bottom: 0; }

/* ── footer navigation ──────────────────────────────────────────────── */
.pagenav {
  margin-top: calc(var(--line-height) * 2);
  margin-bottom: 0;
}
.pagenav .cell {
  border: var(--border-thickness) solid var(--text-color);
  padding: calc(var(--line-height) / 2 - var(--border-thickness) / 2) 1ch;
  margin-top: 0; min-width: 0;
}
.pagenav .cell.empty { border-style: dashed; color: var(--text-color-alt); }
.pagenav .dir { display: block; color: var(--text-color-alt); text-transform: uppercase; }
.pagenav .cell a { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pagenav .cell:hover { background: var(--background-color-alt); }
.pagenav + .msg { margin-top: var(--line-height); }

/* ── status bar ─────────────────────────────────────────────────────────
   Fixed to the bottom: where you are, how far in, and the two toggles.   */
.statusbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  margin: 0;
  background: var(--background-color);
  border-top: var(--border-thickness) solid var(--text-color);
  line-height: var(--line-height);
}
.statusbar-inner {
  display: flex; align-items: center; gap: 1ch;
  margin: 0 auto; width: 100%;
  max-width: calc(min(80ch, round(down, 100%, 1ch)));
  padding: calc(var(--line-height) / 2) 2ch;
}
.statusbar-inner > * { margin-top: 0; }
.sb-path {
  flex: 1 1 auto; min-width: 0; color: var(--text-color-alt);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sb-progress { flex: 0 0 auto; white-space: pre; color: var(--text-color-alt); }
.sb-pct { flex: 0 0 auto; color: var(--text-color-alt); white-space: pre; }
.sb-actions { flex: 0 0 auto; display: flex; gap: 1ch; }
.sb-actions button {
  height: calc(var(--line-height) * 1.5); font-size: 0.75rem;
  padding: 0 calc(1ch - var(--border-thickness));
}
button[aria-pressed="true"] { background: var(--text-color); color: var(--background-color); }
@media screen and (max-width: 640px) {
  .statusbar-inner { padding: calc(var(--line-height) / 2) 1ch; }
  .sb-progress { display: none; }
}
@media screen and (max-width: 420px) {
  .sb-pct { display: none; }
}

.msg { color: var(--text-color-alt); }
kbd {
  border: 1px solid var(--text-color-alt); padding: 0 0.5ch;
  font-size: 0.8rem; color: var(--text-color-alt);
}
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
</style>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════════════════
   A small markdown parser. Handles exactly the subset this corpus uses:
   ATX headings, thematic breaks, GFM tables, blockquotes, fenced code,
   ordered and unordered lists (one level of nesting), and the inline set
   (emphasis, strong, code spans, strikethrough, marks, links, autolinks).
   ══════════════════════════════════════════════════════════════════════════ */

const REPO = "https://github.com/Lulzx/future";
const DEFAULT_DOC = "README.md";

/* ── path resolution ─────────────────────────────────────────────────────── */

function normalize(path) {
  const out = [];
  for (const part of path.split("/")) {
    if (part === "" || part === ".") continue;
    if (part === "..") { out.pop(); continue; }
    out.push(part);
  }
  return out.join("/");
}

function dirname(path) {
  const i = path.lastIndexOf("/");
  return i === -1 ? "" : path.slice(0, i);
}

// Resolve an href found inside `base` (a doc path) to a doc path, or null if
// the link is external / an anchor.
function resolveDoc(href, base) {
  if (/^[a-z][a-z0-9+.-]*:/i.test(href) || href.startsWith("//") || href.startsWith("#")) {
    return null;
  }
  const [rawPath, hash] = href.split("#");
  let target = normalize(dirname(base) + "/" + rawPath);
  if (rawPath.endsWith("/") || !/\.[a-z0-9]+$/i.test(rawPath)) {
    target = normalize(target + "/README.md");
  }
  if (!target.endsWith(".md")) return null;
  return hash ? target + "#" + hash : target;
}

/* ── inline ──────────────────────────────────────────────────────────────── */

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function inline(src, base) {
  const codes = [];
  // Pull code spans out first so their contents are never re-parsed. The
  // sentinel uses private-use code points, so it can never collide with real
  // text -- a bare " 42 " would otherwise be mistaken for a placeholder.
  const S0 = "\uE000", S1 = "\uE001";
  let s = src.replace(/(`+)([\s\S]*?)\1/g, (_, __, body) => {
    codes.push(body.trim());
    return S0 + (codes.length - 1) + S1;
  });

  s = escapeHtml(s);

  // [text](href)
  s = s.replace(/\[([^\]]*)\]\(([^)\s]+)\)/g, (m, text, href) => {
    const doc = resolveDoc(href, base);
    if (doc) return `<a href="#/${doc}">${text}</a>`;
    if (/^[a-z][a-z0-9+.-]*:/i.test(href) || href.startsWith("//")) {
      return `<a href="${href}" rel="noopener noreferrer" target="_blank">${text}</a>`;
    }
    return `<a href="${href}">${text}</a>`;
  });

  s = s.replace(/&lt;(https?:\/\/[^\s>]+)&gt;/g,
      '<a href="$1" rel="noopener noreferrer" target="_blank">$1</a>');

  s = s.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, "$1<em>$2</em>");
  s = s.replace(/==([^=\n]+)==/g, "<mark>$1</mark>");
  s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");

  s = s.replace(/\uE000(\d+)\uE001/g, (_, i) => `<code>${escapeHtml(codes[+i])}</code>`);
  return s;
}

/* ── blocks ──────────────────────────────────────────────────────────────── */

const RE_HEADING   = /^(#{1,6})\s+(.*)$/;
const RE_HR        = /^\s{0,3}(-{3,}|\*{3,}|_{3,})\s*$/;
const RE_FENCE     = /^\s*(```|~~~)(.*)$/;
const RE_QUOTE     = /^\s{0,3}>\s?(.*)$/;
const RE_UL        = /^(\s*)[-*+]\s+(.*)$/;
const RE_OL        = /^(\s*)(\d+)[.)]\s+(.*)$/;
const RE_TROW      = /^\s*\|(.*)\|\s*$/;
const RE_TSEP      = /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/;
const RE_IMG_ONLY  = /^!\[([^\]]*)\]\(([^)\s]+)\)\s*$/;

function splitRow(line) {
  return line.replace(/^\s*\|/, "").replace(/\|\s*$/, "")
             .split("|").map(c => c.trim());
}

function slug(text) {
  return text.toLowerCase().replace(/`/g, "")
    .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
    .replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-");
}

// Columns whose widest cell is short get `width-min`, so a table of claims
// against two probability columns lays out the way it reads.
function tableClasses(head, body) {
  const cols = Math.max(head.length, ...body.map(r => r.length), 0);
  const widths = [];
  for (let c = 0; c < cols; c++) {
    let w = (head[c] || "").length;
    for (const r of body) w = Math.max(w, (r[c] || "").length);
    widths.push(w);
  }
  const widest = widths.indexOf(Math.max(...widths));
  return widths.map((w, i) =>
    i === widest ? "width-auto" : (w <= 14 ? "width-min" : ""));
}

function parse(lines, base) {
  const out = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    if (!line.trim()) { i++; continue; }

    // fenced code
    const fence = line.match(RE_FENCE);
    if (fence) {
      const marker = fence[1];
      const buf = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith(marker)) buf.push(lines[i++]);
      i++; // closing fence
      out.push(`<pre><code>${escapeHtml(buf.join("\n"))}</code></pre>`);
      continue;
    }

    // thematic break — checked before lists so `---` never reads as a bullet
    if (RE_HR.test(line)) { out.push("<hr>"); i++; continue; }

    // heading
    const h = line.match(RE_HEADING);
    if (h) {
      const level = h[1].length;
      const raw = h[2].trim();
      const id = slug(raw);
      const anchor = `<a class="anchor" href="#/${base}#${id}" aria-label="Link to this section">#</a>`;
      out.push(`<h${level} id="${id}">${inline(raw, base)}${anchor}</h${level}>`);
      i++;
      continue;
    }

    // table
    if (RE_TROW.test(line) && i + 1 < lines.length && RE_TSEP.test(lines[i + 1])) {
      const head = splitRow(line);
      i += 2;
      const body = [];
      while (i < lines.length && RE_TROW.test(lines[i])) body.push(splitRow(lines[i++]));
      const cls = tableClasses(head, body);
      const klass = c => cls[c] ? ` class="${cls[c]}"` : "";
      const th = head.map((c, n) => `<th${klass(n)}>${inline(c, base)}</th>`).join("");
      const rows = body.map(r =>
        "<tr>" + r.map((c, n) => `<td${klass(n)}>${inline(c, base)}</td>`).join("") + "</tr>").join("");
      const headEmpty = head.every(c => c === "");
      out.push(
        `<div class="table-scroll"><table>` +
        (headEmpty ? "" : `<thead><tr>${th}</tr></thead>`) +
        `<tbody>${rows}</tbody></table></div>`
      );
      continue;
    }

    // blockquote
    if (RE_QUOTE.test(line)) {
      const buf = [];
      while (i < lines.length && RE_QUOTE.test(lines[i])) {
        buf.push(lines[i].match(RE_QUOTE)[1]);
        i++;
      }
      out.push(`<blockquote>${parse(buf, base)}</blockquote>`);
      continue;
    }

    // lists
    if (RE_UL.test(line) || RE_OL.test(line)) {
      const ordered = RE_OL.test(line);
      const baseIndent = (line.match(ordered ? RE_OL : RE_UL)[1] || "").length;
      const items = [];
      while (i < lines.length) {
        const cur = lines[i];
        const mu = cur.match(RE_UL), mo = cur.match(RE_OL);
        const m = ordered ? mo : mu;
        const anyM = mu || mo;
        if (!anyM) {
          // lazy continuation of the current item
          if (cur.trim() && items.length && !RE_HR.test(cur) && !RE_HEADING.test(cur) && !RE_TROW.test(cur) && !RE_QUOTE.test(cur)) {
            items[items.length - 1].lines.push(cur.trim());
            i++;
            continue;
          }
          break;
        }
        const indent = (anyM[1] || "").length;
        if (indent > baseIndent) {
          // nested list — collect its lines and recurse
          const sub = [];
          while (i < lines.length) {
            const nm = lines[i].match(RE_UL) || lines[i].match(RE_OL);
            if (!nm || (nm[1] || "").length <= baseIndent) break;
            sub.push(lines[i].slice(baseIndent + 1));
            i++;
          }
          if (items.length) items[items.length - 1].sub = parse(sub, base);
          continue;
        }
        if ((mu && ordered) || (mo && !ordered)) break; // list type changed
        items.push({ lines: [ordered ? mo[3] : mu[2]], sub: "" });
        i++;
      }
      const tag = ordered ? "ol" : "ul";
      const html = items.map(it =>
        `<li>${inline(it.lines.join(" "), base)}${it.sub}</li>`).join("");
      out.push(`<${tag}>${html}</${tag}>`);
      continue;
    }

    // a lone image becomes a figure, with its alt text as the caption
    const img = line.trim().match(RE_IMG_ONLY);
    if (img) {
      out.push(`<figure><img src="${escapeHtml(img[2])}" alt="${escapeHtml(img[1])}">` +
               (img[1] ? `<figcaption>${inline(img[1], base)}</figcaption>` : "") +
               `</figure>`);
      i++;
      continue;
    }

    // paragraph
    const buf = [];
    while (i < lines.length && lines[i].trim() &&
           !RE_HEADING.test(lines[i]) && !RE_HR.test(lines[i]) &&
           !RE_QUOTE.test(lines[i]) && !RE_FENCE.test(lines[i]) &&
           !RE_UL.test(lines[i]) && !RE_OL.test(lines[i]) &&
           !RE_IMG_ONLY.test(lines[i].trim()) &&
           !(RE_TROW.test(lines[i]) && RE_TSEP.test(lines[i + 1] || ""))) {
      buf.push(lines[i++]);
    }
    if (buf.length) out.push(`<p>${inline(buf.join("\n"), base)}</p>`);
    else i++;
  }

  return out.join("\n");
}

function render(md, base) {
  return parse(md.replace(/\r\n?/g, "\n").split("\n"), base);
}

/* ══════════════════════════════════════════════════════════════════════════
   Post-render passes — the things markdown does not say but the page needs
   ══════════════════════════════════════════════════════════════════════════ */

/* `> **Prediction:** …` — hoist the label onto the box border. */
function labelCallouts(root) {
  for (const bq of root.querySelectorAll("blockquote")) {
    const first = bq.firstElementChild;
    if (!first || first.tagName !== "P") continue;
    const strong = first.firstElementChild;
    if (!strong || strong.tagName !== "STRONG") continue;
    const text = strong.textContent.trim();
    if (!/:$/.test(text) || text.length > 28) continue;
    bq.setAttribute("data-label", text.replace(/:$/, ""));
    strong.remove();
    // drop the space the label left behind
    if (first.firstChild && first.firstChild.nodeType === 3) {
      first.firstChild.data = first.firstChild.data.replace(/^\s+/, "");
    }
  }
}

/* §1, §1.1 … on the headings of every page but the index. */
function numberSections(root) {
  let h2 = 0, h3 = 0;
  for (const h of root.querySelectorAll("h2, h3")) {
    if (h.tagName === "H2") { h2++; h3 = 0; h.dataset.sec = "§" + h2; }
    else { h3++; h.dataset.sec = h2 ? `§${h2}.${h3}` : `§${h3}`; }
  }
}

/* A tree-drawn table of contents, from the page's own h2/h3. */
function buildToc(root, doc) {
  const heads = [...root.querySelectorAll("h2, h3")];
  if (heads.length < 3) return null;

  const items = [];
  for (const h of heads) {
    const label = h.dataset.sec ? `<span class="sec">${h.dataset.sec}</span> ` : "";
    const text = escapeHtml(h.textContent.replace(/#$/, "").trim());
    const entry = `${label}<a href="#/${doc}#${h.id}">${text}</a>`;
    if (h.tagName === "H2" || !items.length) items.push({ entry, kids: [] });
    else items[items.length - 1].kids.push(entry);
  }

  const html = items.map(it =>
    `<li>${it.entry}` +
    (it.kids.length ? `<ul>${it.kids.map(k => `<li>${k}</li>`).join("")}</ul>` : "") +
    `</li>`).join("");

  const el = document.createElement("details");
  el.className = "toc";
  el.open = window.innerWidth > 640;
  el.innerHTML = `<summary>Contents</summary><ul class="tree">${html}</ul>`;
  return el;
}

/* The `← [Index] · [Part IV]` strip and the closing `**Next:** …` line are
   the corpus's own navigation. Recognize them, style the first, and turn the
   second into a prev/next footer. */
function extractNav(root) {
  const nav = { prev: null, next: null };
  const ps = [...root.querySelectorAll("p")];

  const up = ps.find(p => /^\s*←/.test(p.textContent));
  if (up) {
    up.classList.add("nav-up");
    // Pages list their ancestors in either order (`← Index · Part IV`, or
    // `← Part I · Index`); the part is the more useful "previous" of the two.
    const links = [...up.querySelectorAll("a")];
    const a = links.find(l => l.textContent.trim().toLowerCase() !== "index") || links[0];
    if (a) nav.prev = { href: a.getAttribute("href"), text: a.textContent.trim() };
  }

  const next = ps.find(p => /^\s*Next:/.test(p.textContent));
  if (next) {
    const a = next.querySelector("a");
    if (a) nav.next = { href: a.getAttribute("href"), text: a.textContent.trim() };
    // the closing `---` above it is now redundant
    const hr = next.previousElementSibling;
    next.remove();
    if (hr && hr.tagName === "HR") hr.remove();
  }

  // a dateline in italics near the top reads as metadata, not prose
  for (const p of ps.slice(0, 4)) {
    if (p.children.length === 1 && p.firstElementChild.tagName === "EM" &&
        p.textContent.trim() === p.firstElementChild.textContent.trim()) {
      p.classList.add("dateline");
      break;
    }
  }

  return nav;
}

function pagenavHtml(nav, doc) {
  const cell = (dir, link) => link
    ? `<div class="cell"><span class="dir">${dir}</span><a href="${link.href}">${escapeHtml(link.text)}</a></div>`
    : `<div class="cell empty"><span class="dir">${dir}</span>—</div>`;
  return `<nav class="pagenav grid">` +
    cell("← Prev", nav.prev) +
    cell("Next →", nav.next) +
  `</nav>`;
}

/* ══════════════════════════════════════════════════════════════════════════
   Loader and router
   ══════════════════════════════════════════════════════════════════════════ */

const contentEl  = document.getElementById("content");
const crumbEl    = document.getElementById("crumb");
const sbPathEl   = document.getElementById("sb-path");
const sbProgEl   = document.getElementById("sb-progress");
const sbPctEl    = document.getElementById("sb-pct");
const cache      = new Map();
let currentDoc   = DEFAULT_DOC;
let currentNav   = { prev: null, next: null };

function docFromHash() {
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const path = raw.split("#")[0];
  if (!path) return DEFAULT_DOC;
  return normalize(path).endsWith(".md") ? normalize(path) : DEFAULT_DOC;
}

function anchorFromHash() {
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const parts = raw.split("#");
  return parts.length > 1 ? parts[1] : "";
}

function breadcrumb(doc) {
  const segs = doc.split("/");
  const out = [`<a href="#/${DEFAULT_DOC}">future</a>`];
  let acc = "";
  segs.forEach((seg, idx) => {
    acc = acc ? acc + "/" + seg : seg;
    const last = idx === segs.length - 1;
    if (last) out.push(`<span>${escapeHtml(seg)}</span>`);
    else out.push(`<a href="#/${acc}/README.md">${escapeHtml(seg)}</a>`);
  });
  return out.join(`<span class="sep"> / </span>`);
}

async function load(doc) {
  currentDoc = doc;
  crumbEl.innerHTML = breadcrumb(doc);
  sbPathEl.textContent = "/" + doc;

  let md = cache.get(doc);
  if (md === undefined) {
    contentEl.innerHTML = '<p class="msg">Loading…</p>';
    try {
      const res = await fetch(doc, { cache: "no-cache" });
      if (!res.ok) throw new Error(res.status + " " + res.statusText);
      md = await res.text();
      cache.set(doc, md);
    } catch (err) {
      contentEl.className = "";
      contentEl.innerHTML =
        `<h1>Not found</h1><p class="msg">Could not load <code>${escapeHtml(doc)}</code> — ${escapeHtml(String(err.message || err))}.</p>` +
        `<p><a href="#/${DEFAULT_DOC}">Back to the index</a></p>`;
      document.title = "Not found · The Next Fifteen Years";
      currentNav = { prev: null, next: null };
      updateProgress();
      return;
    }
  }

  const isIndex = doc === DEFAULT_DOC;
  contentEl.className = isIndex ? "index" : "numbered";
  contentEl.innerHTML = render(md, doc);

  labelCallouts(contentEl);
  if (!isIndex) numberSections(contentEl);
  currentNav = extractNav(contentEl);

  if (!isIndex) {
    const toc = buildToc(contentEl, doc);
    if (toc) {
      // after the title block: the first rule, or the h1
      const hr = contentEl.querySelector("hr");
      const after = hr || contentEl.querySelector("h1");
      if (after) after.after(toc); else contentEl.prepend(toc);
    }
  }

  if (!currentNav.prev && !isIndex) {
    currentNav.prev = { href: `#/${DEFAULT_DOC}`, text: "Index" };
  }
  contentEl.insertAdjacentHTML("beforeend",
    pagenavHtml(currentNav, doc) +
    `<p class="msg"><a href="${REPO}/blob/main/${doc}" rel="noopener noreferrer" target="_blank">View markdown source</a></p>`);

  const h1 = contentEl.querySelector("h1");
  document.title = (h1 ? h1.textContent.replace(/#$/, "").trim() : doc) + " · The Next Fifteen Years";

  const anchor = anchorFromHash();
  if (anchor) {
    const el = document.getElementById(anchor);
    if (el) { el.scrollIntoView(); updateProgress(); return; }
  }
  window.scrollTo(0, 0);
  updateProgress();
}

window.addEventListener("hashchange", () => load(docFromHash()));

/* ── status bar ──────────────────────────────────────────────────────────── */

const BAR_CELLS = 12;

function updateProgress() {
  const doc = document.documentElement;
  const max = doc.scrollHeight - window.innerHeight;
  const pct = max > 8 ? Math.min(1, Math.max(0, window.scrollY / max)) : 1;
  const filled = Math.round(pct * BAR_CELLS);
  sbProgEl.textContent = "▓".repeat(filled) + "░".repeat(BAR_CELLS - filled);
  sbPctEl.textContent = String(Math.round(pct * 100)).padStart(3, " ") + "%";
}

window.addEventListener("scroll", updateProgress, { passive: true });
window.addEventListener("resize", updateProgress);

/* ── controls ────────────────────────────────────────────────────────────── */

const root = document.documentElement;
const stored = localStorage.getItem("theme");
if (stored) root.setAttribute("data-theme", stored);

const gridBtn = document.getElementById("grid");
if (localStorage.getItem("grid") === "1") {
  document.body.classList.add("debug");
  gridBtn.setAttribute("aria-pressed", "true");
}

function toggleTheme() {
  const isDark = root.getAttribute("data-theme") === "dark" ||
    (!root.getAttribute("data-theme") &&
      window.matchMedia("(prefers-color-scheme: dark)").matches);
  const next = isDark ? "light" : "dark";
  root.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
}

function toggleGrid() {
  const on = document.body.classList.toggle("debug");
  gridBtn.setAttribute("aria-pressed", String(on));
  localStorage.setItem("grid", on ? "1" : "0");
}

document.getElementById("theme").addEventListener("click", toggleTheme);
gridBtn.addEventListener("click", toggleGrid);
document.getElementById("src").addEventListener("click", () => {
  window.open(`${REPO}/blob/main/${currentDoc}`, "_blank", "noopener");
});

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;

  if (e.key === "ArrowLeft"  && currentNav.prev) { location.hash = currentNav.prev.href; e.preventDefault(); }
  else if (e.key === "ArrowRight" && currentNav.next) { location.hash = currentNav.next.href; e.preventDefault(); }
  else if (e.key === "t") toggleTheme();
  else if (e.key === "g") toggleGrid();
  else if (e.key === "i") location.hash = "#/" + DEFAULT_DOC;
});

load(docFromHash());
</script>

</body>
</html>
