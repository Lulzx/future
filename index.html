<body>

        </td>
      </tr>

        <th class="width-min">Section</th>

  <div class="statusbar-inner">

      <button id="theme" type="button" title="Toggle light / dark (t)">Theme</button>
      <button id="grid" type="button" aria-pressed="false" title="Show the character grid (g)">Grid</button>
      <button id="src" type="button" title="View this page's markdown source">Src</button>
    </span>

</footer>

<dialog id="find-dialog" class="find-dialog">
  <form method="dialog" class="find-form" id="find-form">
    <label class="find-label" for="find-input">Find page</label>
    <input id="find-input" type="search" autocomplete="off" spellcheck="false"
      placeholder="Title or path…" aria-controls="find-results">
    <ul id="find-results" class="find-results" role="listbox"></ul>
    <p class="find-hint"><kbd>↑</kbd><kbd>↓</kbd> select · <kbd>Enter</kbd> open · <kbd>Esc</kbd> close</p>
  </form>
</dialog>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════════════════
   A small markdown parser. Handles exactly the subset this corpus uses:
   ATX headings, thematic breaks, GFM tables, blockquotes, fenced code,
   ordered and unordered lists (one level of nesting), and the inline set
   (emphasis, strong, code spans, strikethrough, marks, links, autolinks).
   ══════════════════════════════════════════════════════════════════════════ */

const REPO = "https://github.com/Lulzx/future";
const DEFAULT_DOC = "README.md";

/* ── path resolution ─────────────────────────────────────────────────────── */

function normalize(path) {
  const out = [];
  for (const part of path.split("/")) {
    if (part === "" || part === ".") continue;
    if (part === "..") { out.pop(); continue; }
    out.push(part);
  }
  return out.join("/");
}

function dirname(path) {
  const i = path.lastIndexOf("/");
  return i === -1 ? "" : path.slice(0, i);
}

// Resolve an href found inside `base` (a doc path) to a doc path, or null if
// the link is external / an anchor.
function resolveDoc(href, base) {
  if (/^[a-z][a-z0-9+.-]*:/i.test(href) || href.startsWith("//") || href.startsWith("#")) {
    return null;
  }
  const [rawPath, hash] = href.split("#");
  let target = normalize(dirname(base) + "/" + rawPath);
  if (rawPath.endsWith("/") || !/\.[a-z0-9]+$/i.test(rawPath)) {
    target = normalize(target + "/README.md");
  }
  if (!target.endsWith(".md")) return null;
  return hash ? target + "#" + hash : target;
}

/* ── inline ──────────────────────────────────────────────────────────────── */

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function inline(src, base) {
  const codes = [];
  // Pull code spans out first so their contents are never re-parsed. The
  // sentinel uses private-use code points, so it can never collide with real
  // text -- a bare " 42 " would otherwise be mistaken for a placeholder.
  const S0 = "\uE000", S1 = "\uE001";
  let s = src.replace(/(`+)([\s\S]*?)\1/g, (_, __, body) => {
    codes.push(body.trim());
    return S0 + (codes.length - 1) + S1;
  });

  s = escapeHtml(s);

  // [text](href)
  s = s.replace(/\[([^\]]*)\]\(([^)\s]+)\)/g, (m, text, href) => {
    const doc = resolveDoc(href, base);
    if (doc) return `<a href="#/${doc}">${text}</a>`;
    if (/^[a-z][a-z0-9+.-]*:/i.test(href) || href.startsWith("//")) {
      return `<a href="${href}" rel="noopener noreferrer" target="_blank">${text}</a>`;
    }
    return `<a href="${href}">${text}</a>`;
  });

  s = s.replace(/&lt;(https?:\/\/[^\s>]+)&gt;/g,
      '<a href="$1" rel="noopener noreferrer" target="_blank">$1</a>');

  s = s.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, "$1<em>$2</em>");
  s = s.replace(/==([^=\n]+)==/g, "<mark>$1</mark>");
  s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");

  s = s.replace(/\uE000(\d+)\uE001/g, (_, i) => `<code>${escapeHtml(codes[+i])}</code>`);
  return s;
}

/* ── blocks ──────────────────────────────────────────────────────────────── */

const RE_HEADING   = /^(#{1,6})\s+(.*)$/;
const RE_HR        = /^\s{0,3}(-{3,}|\*{3,}|_{3,})\s*$/;
const RE_FENCE     = /^\s*(```|~~~)(.*)$/;
const RE_QUOTE     = /^\s{0,3}>\s?(.*)$/;
const RE_UL        = /^(\s*)[-*+]\s+(.*)$/;
const RE_OL        = /^(\s*)(\d+)[.)]\s+(.*)$/;
const RE_TROW      = /^\s*\|(.*)\|\s*$/;
const RE_TSEP      = /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/;
const RE_IMG_ONLY  = /^!\[([^\]]*)\]\(([^)\s]+)\)\s*$/;

function splitRow(line) {
  return line.replace(/^\s*\|/, "").replace(/\|\s*$/, "")
             .split("|").map(c => c.trim());
}

function slug(text) {
  return text.toLowerCase().replace(/`/g, "")
    .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
    .replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-");
}

// Columns whose widest cell is short get `width-min`, so a table of claims
// against two probability columns lays out the way it reads.
function tableClasses(head, body) {
  const cols = Math.max(head.length, ...body.map(r => r.length), 0);
  const widths = [];
  for (let c = 0; c < cols; c++) {
    let w = (head[c] || "").length;
    for (const r of body) w = Math.max(w, (r[c] || "").length);
    widths.push(w);
  }
  const widest = widths.indexOf(Math.max(...widths));
  return widths.map((w, i) =>
    i === widest ? "width-auto" : (w <= 14 ? "width-min" : ""));
}

function parse(lines, base) {
  const out = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    if (!line.trim()) { i++; continue; }

    // fenced code
    const fence = line.match(RE_FENCE);
    if (fence) {
      const marker = fence[1];
      const buf = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith(marker)) buf.push(lines[i++]);
      i++; // closing fence
      out.push(`<pre><code>${escapeHtml(buf.join("\n"))}</code></pre>`);
      continue;
    }

    // thematic break — checked before lists so `---` never reads as a bullet
    if (RE_HR.test(line)) { out.push("<hr>"); i++; continue; }

    // heading
    const h = line.match(RE_HEADING);
    if (h) {
      const level = h[1].length;
      const raw = h[2].trim();
      const id = slug(raw);
      const anchor = `<a class="anchor" href="#/${base}#${id}" aria-label="Link to this section">#</a>`;
      out.push(`<h${level} id="${id}">${inline(raw, base)}${anchor}</h${level}>`);
      i++;
      continue;
    }

    // table
    if (RE_TROW.test(line) && i + 1 < lines.length && RE_TSEP.test(lines[i + 1])) {
      const head = splitRow(line);
      i += 2;
      const body = [];
      while (i < lines.length && RE_TROW.test(lines[i])) body.push(splitRow(lines[i++]));
      const cls = tableClasses(head, body);
      const klass = c => cls[c] ? ` class="${cls[c]}"` : "";
      const th = head.map((c, n) => `<th${klass(n)}>${inline(c, base)}</th>`).join("");
      const rows = body.map(r =>
        "<tr>" + r.map((c, n) => `<td${klass(n)}>${inline(c, base)}</td>`).join("") + "</tr>").join("");
      const headEmpty = head.every(c => c === "");
      out.push(
        `<div class="table-scroll"><table>` +
        (headEmpty ? "" : `<thead><tr>${th}</tr></thead>`) +
        `<tbody>${rows}</tbody></table></div>`
      );
      continue;
    }

    // blockquote
    if (RE_QUOTE.test(line)) {
      const buf = [];
      while (i < lines.length && RE_QUOTE.test(lines[i])) {
        buf.push(lines[i].match(RE_QUOTE)[1]);
        i++;
      }
      out.push(`<blockquote>${parse(buf, base)}</blockquote>`);
      continue;
    }

    // lists
    if (RE_UL.test(line) || RE_OL.test(line)) {
      const ordered = RE_OL.test(line);
      const baseIndent = (line.match(ordered ? RE_OL : RE_UL)[1] || "").length;
      const items = [];
      while (i < lines.length) {
        const cur = lines[i];
        const mu = cur.match(RE_UL), mo = cur.match(RE_OL);
        const m = ordered ? mo : mu;
        const anyM = mu || mo;
        if (!anyM) {
          // lazy continuation of the current item
          if (cur.trim() && items.length && !RE_HR.test(cur) && !RE_HEADING.test(cur) && !RE_TROW.test(cur) && !RE_QUOTE.test(cur)) {
            items[items.length - 1].lines.push(cur.trim());
            i++;
            continue;
          }
          break;
        }
        const indent = (anyM[1] || "").length;
        if (indent > baseIndent) {
          // nested list — collect its lines and recurse
          const sub = [];
          while (i < lines.length) {
            const nm = lines[i].match(RE_UL) || lines[i].match(RE_OL);
            if (!nm || (nm[1] || "").length <= baseIndent) break;
            sub.push(lines[i].slice(baseIndent + 1));
            i++;
          }
          if (items.length) items[items.length - 1].sub = parse(sub, base);
          continue;
        }
        if ((mu && ordered) || (mo && !ordered)) break; // list type changed
        items.push({ lines: [ordered ? mo[3] : mu[2]], sub: "" });
        i++;
      }
      const tag = ordered ? "ol" : "ul";
      const html = items.map(it =>
        `<li>${inline(it.lines.join(" "), base)}${it.sub}</li>`).join("");
      out.push(`<${tag}>${html}</${tag}>`);
      continue;
    }

    // a lone image becomes a figure, with its alt text as the caption
    const img = line.trim().match(RE_IMG_ONLY);
    if (img) {
      out.push(`<figure><img src="${escapeHtml(img[2])}" alt="${escapeHtml(img[1])}">` +
               (img[1] ? `<figcaption>${inline(img[1], base)}</figcaption>` : "") +
               `</figure>`);
      i++;
      continue;
    }

    // paragraph
    const buf = [];
    while (i < lines.length && lines[i].trim() &&
           !RE_HEADING.test(lines[i]) && !RE_HR.test(lines[i]) &&
           !RE_QUOTE.test(lines[i]) && !RE_FENCE.test(lines[i]) &&
           !RE_UL.test(lines[i]) && !RE_OL.test(lines[i]) &&
           !RE_IMG_ONLY.test(lines[i].trim()) &&
           !(RE_TROW.test(lines[i]) && RE_TSEP.test(lines[i + 1] || ""))) {
      buf.push(lines[i++]);
    }
    if (buf.length) out.push(`<p>${inline(buf.join("\n"), base)}</p>`);
    else i++;
  }

  return out.join("\n");
}

function render(md, base) {
  return parse(md.replace(/\r\n?/g, "\n").split("\n"), base);
}

/* ══════════════════════════════════════════════════════════════════════════
   Post-render passes — the things markdown does not say but the page needs
   ══════════════════════════════════════════════════════════════════════════ */

/* `> **Prediction:** …` — hoist the label onto the box border. */
function labelCallouts(root) {
  for (const bq of root.querySelectorAll("blockquote")) {
    const first = bq.firstElementChild;
    if (!first || first.tagName !== "P") continue;
    const strong = first.firstElementChild;
    if (!strong || strong.tagName !== "STRONG") continue;
    const text = strong.textContent.trim();
    if (!/:$/.test(text) || text.length > 28) continue;
    bq.setAttribute("data-label", text.replace(/:$/, ""));
    strong.remove();
    // drop the space the label left behind
    if (first.firstChild && first.firstChild.nodeType === 3) {
      first.firstChild.data = first.firstChild.data.replace(/^\s+/, "");
    }
  }
}

/* §1, §1.1 … on the headings of every page but the index. */
function numberSections(root) {
  let h2 = 0, h3 = 0;
  for (const h of root.querySelectorAll("h2, h3")) {
    if (h.tagName === "H2") { h2++; h3 = 0; h.dataset.sec = "§" + h2; }
    else { h3++; h.dataset.sec = h2 ? `§${h2}.${h3}` : `§${h3}`; }
  }
}

/* A tree-drawn table of contents, from the page's own h2/h3. */
function buildToc(root, doc) {
  const heads = [...root.querySelectorAll("h2, h3")];
  if (heads.length < 3) return null;

  const items = [];
  for (const h of heads) {
    const label = h.dataset.sec ? `<span class="sec">${h.dataset.sec}</span> ` : "";
    const text = escapeHtml(h.textContent.replace(/#$/, "").trim());
    const entry = `${label}<a href="#/${doc}#${h.id}">${text}</a>`;
    if (h.tagName === "H2" || !items.length) items.push({ entry, kids: [] });
    else items[items.length - 1].kids.push(entry);
  }

  const html = items.map(it =>
    `<li>${it.entry}` +
    (it.kids.length ? `<ul>${it.kids.map(k => `<li>${k}</li>`).join("")}</ul>` : "") +
    `</li>`).join("");

  const el = document.createElement("details");
  el.className = "toc";
  el.open = window.innerWidth > 640;
  el.innerHTML = `<summary>Contents</summary><ul class="tree">${html}</ul>`;
  return el;
}

/* The `← [Index] · [Part IV]` strip and the closing `**Next:** …` line are
   the corpus's own navigation. Recognize them, style the first, and turn the
   second into a prev/next footer. */
function extractNav(root) {
  const nav = { prev: null, next: null };
  const ps = [...root.querySelectorAll("p")];

  const up = ps.find(p => /^\s*←/.test(p.textContent));
  if (up) {
    up.classList.add("nav-up");
    // Pages list their ancestors in either order (`← Index · Part IV`, or
    // `← Part I · Index`); the part is the more useful "previous" of the two.
    const links = [...up.querySelectorAll("a")];
    const a = links.find(l => l.textContent.trim().toLowerCase() !== "index") || links[0];
    if (a) nav.prev = { href: a.getAttribute("href"), text: a.textContent.trim() };
  }

  const next = ps.find(p => /^\s*Next:/.test(p.textContent));
  if (next) {
    const a = next.querySelector("a");
    if (a) nav.next = { href: a.getAttribute("href"), text: a.textContent.trim() };
    // the closing `---` above it is now redundant
    const hr = next.previousElementSibling;
    next.remove();
    if (hr && hr.tagName === "HR") hr.remove();
  }

  // a dateline in italics near the top reads as metadata, not prose
  for (const p of ps.slice(0, 4)) {
    if (p.children.length === 1 && p.firstElementChild.tagName === "EM" &&
        p.textContent.trim() === p.firstElementChild.textContent.trim()) {
      p.classList.add("dateline");
      break;
    }
  }

  return nav;
}

function pagenavHtml(nav, doc) {
  const cell = (dir, link) => link
    ? `<div class="cell"><span class="dir">${dir}</span><a href="${link.href}">${escapeHtml(link.text)}</a></div>`
    : `<div class="cell empty"><span class="dir">${dir}</span>—</div>`;
  return `<nav class="pagenav grid">` +
    cell("← Prev", nav.prev) +
    cell("Next →", nav.next) +
  `</nav>`;
}

/* ══════════════════════════════════════════════════════════════════════════
   Loader and router
   ══════════════════════════════════════════════════════════════════════════ */

const contentEl  = document.getElementById("content");
const crumbEl    = document.getElementById("crumb");
const sbPathEl   = document.getElementById("sb-path");
const sbProgEl   = document.getElementById("sb-progress");
const sbPctEl    = document.getElementById("sb-pct");
const cache      = new Map();
let currentDoc   = DEFAULT_DOC;
let currentNav   = { prev: null, next: null };

function docFromHash() {
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const path = raw.split("#")[0];
  if (!path) return DEFAULT_DOC;
  return normalize(path).endsWith(".md") ? normalize(path) : DEFAULT_DOC;
}

function anchorFromHash() {
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const parts = raw.split("#");
  return parts.length > 1 ? parts[1] : "";
}

function breadcrumb(doc) {
  const segs = doc.split("/");
  const out = [`<a href="#/${DEFAULT_DOC}">future</a>`];
  let acc = "";
  segs.forEach((seg, idx) => {
    acc = acc ? acc + "/" + seg : seg;
    const last = idx === segs.length - 1;
    if (last) out.push(`<span>${escapeHtml(seg)}</span>`);
    else out.push(`<a href="#/${acc}/README.md">${escapeHtml(seg)}</a>`);
  });
  return out.join(`<span class="sep"> / </span>`);
}

async function load(doc) {
  currentDoc = doc;
  crumbEl.innerHTML = breadcrumb(doc);
  sbPathEl.textContent = "/" + doc;

  let md = cache.get(doc);
  if (md === undefined) {
    contentEl.innerHTML = '<p class="msg">Loading…</p>';
    try {
      const res = await fetch(doc, { cache: "no-cache" });
      if (!res.ok) throw new Error(res.status + " " + res.statusText);
      md = await res.text();
      cache.set(doc, md);
    } catch (err) {
      contentEl.className = "";
      contentEl.innerHTML =
        `<h1>Not found</h1><p class="msg">Could not load <code>${escapeHtml(doc)}</code> — ${escapeHtml(String(err.message || err))}.</p>` +
        `<p><a href="#/${DEFAULT_DOC}">Back to the index</a></p>`;
      document.title = "Not found · The Next Fifteen Years";
      currentNav = { prev: null, next: null };
      updateProgress();
      return;
    }
  }

  const isIndex = doc === DEFAULT_DOC;
  contentEl.className = isIndex ? "index" : "numbered";
  contentEl.innerHTML = render(md, doc);

  labelCallouts(contentEl);
  if (!isIndex) numberSections(contentEl);
  currentNav = extractNav(contentEl);

  if (!isIndex) {
    const toc = buildToc(contentEl, doc);
    if (toc) {
      // after the title block: the first rule, or the h1
      const hr = contentEl.querySelector("hr");
      const after = hr || contentEl.querySelector("h1");
      if (after) after.after(toc); else contentEl.prepend(toc);
    }
  }

  if (!currentNav.prev && !isIndex) {
    currentNav.prev = { href: `#/${DEFAULT_DOC}`, text: "Index" };
  }
  contentEl.insertAdjacentHTML("beforeend",
    pagenavHtml(currentNav, doc) +
    `<p class="msg"><a href="${REPO}/blob/main/${doc}" rel="noopener noreferrer" target="_blank">View markdown source</a></p>`);

  const h1 = contentEl.querySelector("h1");
  document.title = (h1 ? h1.textContent.replace(/#$/, "").trim() : doc) + " · The Next Fifteen Years";

  const anchor = anchorFromHash();
  if (anchor) {
    const el = document.getElementById(anchor);
    if (el) { el.scrollIntoView(); updateProgress(); return; }
  }
  window.scrollTo(0, 0);
  updateProgress();
}

window.addEventListener("hashchange", () => load(docFromHash()));

/* ── status bar ──────────────────────────────────────────────────────────── */

const BAR_CELLS = 12;

function updateProgress() {
  const doc = document.documentElement;
  const max = doc.scrollHeight - window.innerHeight;
  const pct = max > 8 ? Math.min(1, Math.max(0, window.scrollY / max)) : 1;
  const filled = Math.round(pct * BAR_CELLS);
  sbProgEl.textContent = "▓".repeat(filled) + "░".repeat(BAR_CELLS - filled);
  sbPctEl.textContent = String(Math.round(pct * 100)).padStart(3, " ") + "%";
}

window.addEventListener("scroll", updateProgress, { passive: true });
window.addEventListener("resize", updateProgress);

/* ── controls ────────────────────────────────────────────────────────────── */

const root = document.documentElement;
const stored = localStorage.getItem("theme");
if (stored) root.setAttribute("data-theme", stored);

const gridBtn = document.getElementById("grid");
if (localStorage.getItem("grid") === "1") {
  document.body.classList.add("debug");
  gridBtn.setAttribute("aria-pressed", "true");
}

function toggleTheme() {
  const isDark = root.getAttribute("data-theme") === "dark" ||
    (!root.getAttribute("data-theme") &&
      window.matchMedia("(prefers-color-scheme: dark)").matches);
  const next = isDark ? "light" : "dark";
  root.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
}

function toggleGrid() {
  const on = document.body.classList.toggle("debug");
  gridBtn.setAttribute("aria-pressed", String(on));
  localStorage.setItem("grid", on ? "1" : "0");
}

document.getElementById("theme").addEventListener("click", toggleTheme);
gridBtn.addEventListener("click", toggleGrid);
document.getElementById("src").addEventListener("click", () => {
  window.open(`${REPO}/blob/main/${currentDoc}`, "_blank", "noopener");
});

/* ── find / catalog ─────────────────────────────────────────────────────── */

const findDialog = document.getElementById("find-dialog");
const findInput  = document.getElementById("find-input");
const findList   = document.getElementById("find-results");
let catalog = null;
let findHits = [];
let findSel = 0;

async function ensureCatalog() {
  if (catalog) return catalog;
  const res = await fetch("catalog.json", { cache: "no-cache" });
  if (!res.ok) throw new Error("catalog.json " + res.status);
  catalog = await res.json();
  return catalog;
}

function scoreEntry(q, entry) {
  const t = entry.title.toLowerCase();
  const p = entry.path.toLowerCase();
  if (t === q || p === q) return 100;
  if (t.startsWith(q) || p.startsWith(q)) return 80;
  if (t.includes(q) || p.includes(q)) return 50;
  const parts = q.split(/\s+/).filter(Boolean);
  if (parts.length > 1 && parts.every(w => t.includes(w) || p.includes(w))) return 40;
  return 0;
}

function renderFindHits() {
  findList.innerHTML = findHits.map((e, i) =>
    `<li role="option" class="${i === findSel ? "is-active" : ""}" data-i="${i}">` +
    `<a href="#/${e.path}"><span class="find-title">${escapeHtml(e.title)}</span>` +
    `<span class="find-path">${escapeHtml(e.path)}</span></a></li>`
  ).join("") || `<li class="find-empty">No matches</li>`;
}

function runFind() {
  const q = findInput.value.trim().toLowerCase();
  if (!catalog) return;
  if (!q) {
    findHits = catalog.slice(0, 40);
  } else {
    findHits = catalog
      .map(e => ({ e, s: scoreEntry(q, e) }))
      .filter(x => x.s > 0)
      .sort((a, b) => b.s - a.s || a.e.path.localeCompare(b.e.path))
      .slice(0, 40)
      .map(x => x.e);
  }
  findSel = 0;
  renderFindHits();
}

async function openFind() {
  try {
    await ensureCatalog();
  } catch (err) {
    alert("Could not load catalog.json: " + err.message);
    return;
  }
  findInput.value = "";
  runFind();
  if (typeof findDialog.showModal === "function") findDialog.showModal();
  else findDialog.setAttribute("open", "");
  findInput.focus();
}

function closeFind() {
  if (findDialog.open) findDialog.close();
}

function goFindSel() {
  const e = findHits[findSel];
  if (!e) return;
  closeFind();
  location.hash = "#/" + e.path;
}

document.getElementById("find").addEventListener("click", openFind);
findInput.addEventListener("input", runFind);
findList.addEventListener("click", (e) => {
  const a = e.target.closest("a");
  if (a) closeFind();
});
findDialog.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") {
    findSel = Math.min(findHits.length - 1, findSel + 1);
    renderFindHits();
    e.preventDefault();
  } else if (e.key === "ArrowUp") {
    findSel = Math.max(0, findSel - 1);
    renderFindHits();
    e.preventDefault();
  } else if (e.key === "Enter") {
    goFindSel();
    e.preventDefault();
  }
});

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;

  if (e.key === "ArrowLeft"  && currentNav.prev) { location.hash = currentNav.prev.href; e.preventDefault(); }
  else if (e.key === "ArrowRight" && currentNav.next) { location.hash = currentNav.next.href; e.preventDefault(); }
  else if (e.key === "t") toggleTheme();
  else if (e.key === "g") toggleGrid();
  else if (e.key === "i") location.hash = "#/" + DEFAULT_DOC;
  else if (e.key === "/" || e.key === "s") { openFind(); e.preventDefault(); }
});

load(docFromHash());
</script>

</body>
</html>
