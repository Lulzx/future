# Web-search proxy for /ask/'s optional web search.
#
# The browser cannot call a search engine directly — none send CORS headers —
# so the page calls /api/websearch on its own origin and parses the returned
# HTML itself (ask/app.js: parseSearchHtml).
#
# Mojeek rather than DuckDuckGo: DuckDuckGo Lite only accepts the query in a
# POST body, and a reverse proxy cannot synthesise one from ?q=. It also serves
# a bot-check page to datacentre addresses, so even GET-with-query fails from
# the server while it works from a laptop. Mojeek answers a plain GET.
#
# Lives inside the future.lulzx.space block in /opt/pgrok/Caddyfile; reload with
#   sudo caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
#
#   handle /api/websearch* {
#     rewrite * /search?q={query.q}
#     reverse_proxy https://www.mojeek.com {
#       header_up Host www.mojeek.com
#       header_up User-Agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
#       header_up Accept-Language "en-US,en;q=0.9"
#       header_up -Referer
#       header_up -Cookie
#       header_down Cache-Control "public, max-age=600"
#     }
#   }
#
# tools/ask-server.mjs implements the same path locally and prefers DuckDuckGo
# there (a home address gets real results), falling back to Mojeek on an empty
# response. Without either backend the page reports the proxy is missing and
# everything else keeps working.
