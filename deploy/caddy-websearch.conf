# DuckDuckGo Lite proxy for /ask/'s optional web search.
#
# The browser cannot call lite.duckduckgo.com directly (no CORS headers), so
# the page calls /api/websearch on its own origin. Caddy forwards it, and the
# page parses the Lite HTML client-side.
#
# Add inside the future.lulzx.space site block in /opt/pgrok/Caddyfile,
# BEFORE the file_server / static handlers, then: sudo systemctl reload caddy
#
#   handle /api/websearch* {
#     rewrite * /lite/?q={query.q}
#     reverse_proxy https://lite.duckduckgo.com {
#       header_up Host lite.duckduckgo.com
#       header_up User-Agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
#       header_up -Referer
#       header_up -Cookie
#       header_down Content-Type "text/html; charset=utf-8"
#       header_down Cache-Control "public, max-age=600"
#     }
#   }
#
# Notes
#   * DuckDuckGo rate-limits scraping per source IP. Expect occasional empty
#     result pages; the UI reports that rather than inventing results.
#   * Serving HTML here means the client parses it — ask/app.js falls back to
#     parsing when the response is not JSON.
#   * Without this route the feature is simply unavailable: the page says so
#     in the activity trace and everything else keeps working.
